name: build-and-test
on: [push, workflow_dispatch]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64 }
          - { os: macos-latest,   rid: osx-arm64 }
          - { os: windows-latest, rid: win-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish FocusMonitor.csproj -c Release -r ${{ matrix.rid }} --self-contained -o out

      - name: Self-test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool xprintidle openbox x11-apps
          chmod +x out/FocusMonitor
          xvfb-run -a bash -c 'openbox & sleep 2; xclock & sleep 2; ./out/FocusMonitor --selftest'

      - name: Self-test (macOS, best effort)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          chmod +x out/FocusMonitor
          ./out/FocusMonitor --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: FocusMonitor-${{ matrix.rid }}
          path: out